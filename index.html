<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giant Bouncing Apple Logo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    #logo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #apple-logo {
      font-size: 20vw;
      position: absolute;
      color: #fff;
      filter: hue-rotate(0deg);
    }

    #warning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #warning-box {
      background: #1c1c1e;
      color: white;
      border-radius: 16px;
      padding: 2rem;
      max-width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.5;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #warning-box strong {
      color: #0a84ff;
    }
  </style>
</head>
<body>
  <div id="logo-container">
    <div id="apple-logo"></div>
  </div>

  <div id="warning-overlay" style="display: none;">
    <div id="warning-box">
      <p>This screensaver is designed for <strong>Safari</strong> on <strong>Apple devices</strong>.</p>
      <p>It may not work properly on other browsers or platforms.</p>
    </div>
  </div>

  <script>
    const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
    const isAppleDevice = /Mac|iPhone|iPad|iPod/i.test(navigator.platform);

    if (!(isSafari && isAppleDevice)) {
      // Show the Apple-style warning, stop the animation
      document.getElementById('logo-container').style.display = 'none';
      document.getElementById('warning-overlay').style.display = 'flex';
    } else {
      // Safari on Apple: Run animation
      const logo = document.getElementById('apple-logo');
      const container = document.getElementById('logo-container');

      let x = 100;
      let y = 100;
      let dx = 2;
      let dy = 2;
      let hue = 0;

      function changeLogoColor() {
        hue += 60;
        logo.style.filter = `hue-rotate(${hue % 360}deg)`;
      }

      function updateLogoPosition() {
        const logoWidth = logo.offsetWidth;
        const logoHeight = logo.offsetHeight;
        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;

        x += dx;
        y += dy;

        let collision = false;

        if (x + logoWidth >= containerWidth || x <= 0) {
          dx = -dx;
          collision = true;
        }
        if (y + logoHeight >= containerHeight || y <= 0) {
          dy = -dy;
          collision = true;
        }

        if (collision) {
          changeLogoColor();
        }

        logo.style.left = x + 'px';
        logo.style.top = y + 'px';

        requestAnimationFrame(updateLogoPosition);
      }

      function centerStartPosition() {
        x = (container.clientWidth - logo.offsetWidth) / 2;
        y = (container.clientHeight - logo.offsetHeight) / 2;
        logo.style.left = x + 'px';
        logo.style.top = y + 'px';
      }

      window.addEventListener('resize', centerStartPosition);

      window.onload = () => {
        centerStartPosition();
        updateLogoPosition();
      };
    }
  </script>
</body>
</html>
